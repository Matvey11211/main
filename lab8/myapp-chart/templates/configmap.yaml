apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myapp-chart.fullname" . }}-config
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>{{ .Values.app.title }}</title>
    </head>
    <body>
      <h1>{{ .Values.app.title }}</h1>
      <p>Environment: {{ .Values.app.environment }}</p>
      <p>Chart Version: {{ .Chart.Version }}</p>
      <p>Release: {{ .Release.Name }}</p>
    </body>
    </html>
